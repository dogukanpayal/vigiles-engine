<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Deneme Tahtası - [ÖZELLİK_ADI]</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-6 min-h-screen flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-lg">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4 border-b border-[var(--border)] pb-3">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
          🎮 CANLI DENEME TAHTASI
        </span>
        <h2 class="text-base font-bold mt-1 text-[var(--foreground)]">[ÖZELLİK_ADI]</h2>
      </div>
      <span class="text-xl">✨</span>
    </div>

    <!-- Interactive Component Area -->
    <div id="sandbox-root" class="space-y-4">
      <!-- Buraya geliştirilen bileşenin canlı demosu yerleşir -->
      <div class="p-4 rounded-xl bg-[var(--background)] border border-[var(--border)] text-center text-xs text-[var(--muted-foreground)]">
        Bu alandaki bileşenle canlı olarak etkileşime geçebilirsiniz.
      </div>
    </div>

    <!-- Live Event Log -->
    <div class="mt-6 pt-3 border-t border-[var(--border)]">
      <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)] mb-1">
        <span>Canlı Olay Günlüğü</span>
        <button onclick="clearLogs()" class="hover:text-[var(--foreground)] text-[10px]">Temizle</button>
      </div>
      <div id="event-log" class="h-20 overflow-y-auto p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] text-[10px] font-mono space-y-1">
        <div class="text-emerald-400">● Canlı ortam hazırlandı. Denemeye başlayabilirsiniz.</div>
      </div>
    </div>
  </div>

  <script>
    function logEvent(msg) {
      const logBox = document.getElementById('event-log');
      const entry = document.createElement('div');
      entry.className = "text-[var(--muted-foreground)]";
      const time = new Date().toLocaleTimeString();
      entry.innerText = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('event-log').innerHTML = '<div class="text-zinc-500">● Günlük temizlendi.</div>';
    }
  </script>
</body>
</html>
