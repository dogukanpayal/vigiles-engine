<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Deneme Tahtası - Vigiles Playground</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    (function() {
      let savedTheme = 'dark';
      try {
        savedTheme = localStorage.getItem('vigiles-theme');
      } catch (e) {}
      if (!savedTheme) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          savedTheme = 'light';
        } else {
          savedTheme = 'dark';
        }
      }
      const isLight = savedTheme === 'light';
      document.documentElement.classList.toggle('light', isLight);
      document.documentElement.classList.toggle('dark', !isLight);
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    :root, [data-theme="dark"], html.dark {
      --background: #090d16;
      --foreground: #f1f5f9;
      --card: #0f172a;
      --border: #1e293b;
      --muted-foreground: #94a3b8;
      color-scheme: dark;
    }

    [data-theme="light"], html.light, body.light {
      --background: #f8fafc !important;
      --foreground: #0f172a !important;
      --card: #ffffff !important;
      --border: #e2e8f0 !important;
      --muted-foreground: #64748b !important;
      color-scheme: light;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-6 min-h-screen flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-xl">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4 border-b border-[var(--border)] pb-3">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
          🎮 16. CANLI DENEME TAHTASI
        </span>
        <h2 class="text-base font-extrabold tracking-tight mt-1 text-[var(--foreground)]">[ÖZELLİK_ADI]</h2>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" id="btn-theme" title="Karanlık / Aydınlık Modunu Değiştir" class="p-1.5 rounded-lg text-xs font-semibold bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] hover:border-amber-400/50 transition cursor-pointer select-none">
          <span id="theme-icon">🌙</span>
        </button>
        <span class="text-xl">✨</span>
      </div>
    </div>

    <!-- Interactive Component Area -->
    <div id="sandbox-root" class="space-y-4">
      <div class="p-4 rounded-xl bg-[var(--background)] border border-[var(--border)] text-center text-xs text-[var(--muted-foreground)]">
        Vigiles görevi tamamlandığında geliştirilen özelliğin canlı etkileşim alanı buraya yerleştirilir.
      </div>
    </div>

    <!-- Live Event Log -->
    <div class="mt-6 pt-3 border-t border-[var(--border)]">
      <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)] mb-1">
        <span>Canlı Olay Günlüğü</span>
        <button onclick="clearLogs()" class="hover:text-[var(--foreground)] text-[10px] cursor-pointer">Temizle</button>
      </div>
      <div id="event-log" class="h-24 overflow-y-auto p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] text-[10px] font-mono space-y-1">
        <div class="text-emerald-400">● Canlı Deneme Tahtası şablonu hazır.</div>
      </div>
    </div>
  </div>

  <script>
    function logEvent(msg) {
      const logBox = document.getElementById('event-log');
      const entry = document.createElement('div');
      entry.className = "text-[var(--muted-foreground)]";
      const time = new Date().toLocaleTimeString();
      entry.innerText = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('event-log').innerHTML = '<div class="text-zinc-500">● Günlük temizlendi.</div>';
    }

    function applyTheme(theme) {
      const isLight = theme === 'light';
      document.documentElement.classList.toggle('light', isLight);
      document.documentElement.classList.toggle('dark', !isLight);
      document.documentElement.setAttribute('data-theme', theme);
      if (document.body) {
        document.body.classList.toggle('light', isLight);
        document.body.classList.toggle('dark', !isLight);
      }
      const icon = document.getElementById('theme-icon');
      if (icon) icon.innerText = isLight ? '\u2600\uFE0F' : '\uD83C\uDF19';
      try {
        localStorage.setItem('vigiles-theme', theme);
      } catch (e) {}
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') ||
                           (document.documentElement.classList.contains('light') ? 'light' : 'dark');
      applyTheme(currentTheme === 'light' ? 'dark' : 'light');
    }

    applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  </script>
</body>
</html>
